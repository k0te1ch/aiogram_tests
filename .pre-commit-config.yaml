repos:
  # Ruff: linter + formatter (replaces black, pyupgrade, reorder-python-imports, autoflake)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      # Run the linter and apply autofixes (unused imports/vars, import sorting, pyupgrade)
      - id: ruff
        args: [--fix]
      # Run the formatter
      - id: ruff-format

  # Run the test suite before committing
  - repo: local
    hooks:
      - id: tests
        name: pytest
        entry: poetry run pytest
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]
