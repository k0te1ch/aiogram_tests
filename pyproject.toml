[tool.poetry]
name = "aiogram-testing"
version = "1.2.1"
description = "A library for testing your bots on aiogram"
authors = ["k0te1ch <khvostov40@gmail.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/k0te1ch/aiogram_tests"
repository = "https://github.com/k0te1ch/aiogram_tests"
packages = [{ include = "aiogram_tests" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Testing",
    "Framework :: Pytest",
]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
# Lowest and latest aiogram are both tested in CI.
aiogram = ">=3.23,<4"

[tool.poetry.plugins."pytest11"]
aiogram_tests = "aiogram_tests.pytest_plugin"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.4.0"
tox = "^4.18.0"
ruff = "^0.15"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade
select = ["E", "W", "F", "I", "UP"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
quote-style = "double"
